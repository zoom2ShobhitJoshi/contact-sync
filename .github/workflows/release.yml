name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version tag (example: v1.0.2)'
        required: true
        default: 'v1.0.2'

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            label: macOS
            eb_args: --mac
          - os: windows-latest
            label: Windows
            eb_args: --win

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build app bundle
        run: npm run build

      - name: Package installer
        shell: bash
        run: |
          set -euo pipefail
          npx electron-builder ${{ matrix.eb_args }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: List packaged files
        if: always()
        shell: bash
        run: |
          echo "=== release/ ==="
          if [ -d release ]; then
            find release -type f | sort
          else
            echo "release/ directory does not exist"
          fi
          echo "=== dist/ (fallback) ==="
          if [ -d dist ]; then
            find dist -type f \( -name '*.dmg' -o -name '*.exe' -o -name '*.zip' -o -name '*.yml' -o -name '*.blockmap' \) | sort || true
          fi
          echo "=== workspace installers ==="
          find . -type f \( -name '*.dmg' -o -name '*.exe' -o -name 'latest*.yml' -o -name '*.blockmap' \) \
            -not -path './node_modules/*' -not -path './.git/*' | sort || true

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: contact-sync-${{ matrix.label }}
          path: |
            release/**
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve release tag
        id: tag
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "name=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "name=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Download macOS artifacts
        uses: actions/download-artifact@v4
        with:
          name: contact-sync-macOS
          path: release

      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: contact-sync-Windows
          path: release

      - name: List release files
        run: find release -type f | sort

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          name: Contact Sync ${{ steps.tag.outputs.name }}
          draft: false
          generate_release_notes: true
          files: release/**
          body: |
            ## Contact Sync ${{ steps.tag.outputs.name }}

            Desktop installers for **macOS** and **Windows**.

            | Platform | File |
            |----------|------|
            | macOS | `ContactSync-*.dmg` — open and drag into Applications |
            | Windows | `ContactSync-Setup-*.exe` — installer |
            | Windows | `ContactSync-Portable-*.exe` — no install needed |

            ### First open on macOS
            Builds are unsigned. If Gatekeeper blocks the app: right-click → **Open**.

            ### WhatsApp note
            This app uses an unofficial WhatsApp Web link (QR). Use at your own risk.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
