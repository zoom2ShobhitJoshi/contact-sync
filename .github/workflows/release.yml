name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version tag (example: v1.0.3)'
        required: true
        default: 'v1.0.3'

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            label: macOS
            eb_args: --mac
          - os: windows-latest
            label: Windows
            eb_args: --win

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build app bundle
        run: npm run build

      - name: Package installer
        shell: bash
        run: npx electron-builder ${{ matrix.eb_args }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: List packaged files
        if: always()
        shell: bash
        run: |
          echo "=== release/ ==="
          find release -type f 2>/dev/null | sort || echo "no release dir"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: contact-sync-${{ matrix.label }}
          path: release/**
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve release tag
        id: tag
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "name=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "name=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Download macOS artifacts
        uses: actions/download-artifact@v4
        with:
          name: contact-sync-macOS
          path: release

      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: contact-sync-Windows
          path: release

      - name: List release files
        run: find release -type f | sort

      - name: Publish release with retries
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.name }}
        shell: bash
        run: |
          set -euo pipefail
          # Only ship installers — never unpacked Electron trees (.pak, .asar, etc.)
          mapfile -t FILES < <(
            find release -type f \( \
              -name 'ContactSync-*.dmg' -o \
              -name 'ContactSync-*.zip' -o \
              -name 'ContactSync-Setup-*.exe' \
            \) | sort
          )
          echo "Installer files to publish:"
          printf '  %s\n' "${FILES[@]}"
          if [ ${#FILES[@]} -eq 0 ]; then
            echo "No installer files found"
            find release -type f | sort || true
            exit 1
          fi

          BODY=$(cat <<EOF
          ## Contact Sync ${TAG}

          Desktop installers for **macOS** and **Windows**.

          | Platform | File |
          |----------|------|
          | macOS | \`ContactSync-*.dmg\` — open and drag into Applications |
          | Windows | \`ContactSync-Setup-*.exe\` — installer |

          ### First open on macOS
          Builds are unsigned. If Gatekeeper blocks the app: right-click → **Open**.
          EOF
          )

          # Fewer, longer waits — secondary rate limits need cooldown, not spam.
          for attempt in 1 2 3; do
            echo "Publish attempt ${attempt}..."
            if gh release view "$TAG" >/dev/null 2>&1; then
              echo "Release ${TAG} already exists — uploading assets"
              if gh release upload "$TAG" "${FILES[@]}" --clobber; then
                echo "Upload succeeded"
                exit 0
              fi
            else
              if gh release create "$TAG" "${FILES[@]}" \
                --title "Contact Sync ${TAG}" \
                --notes "$BODY"; then
                echo "Release created"
                exit 0
              fi
            fi
            if [ "$attempt" -lt 3 ]; then
              wait_s=$((attempt * 120))
              echo "Rate limited or transient error — sleeping ${wait_s}s before retry"
              sleep "$wait_s"
            fi
          done

          echo "Failed to publish release after retries"
          echo "Builds succeeded — download Artifacts from the Actions run and publish manually:"
          echo "  gh run download <run-id> -R zoom2ShobhitJoshi/contact-sync"
          echo "  gh release create ${TAG} <dmg> <exe> --title \"Contact Sync ${TAG}\""
          exit 1
