name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version tag (example: v1.0.1)'
        required: true
        default: 'v1.0.1'

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            label: macOS
            builder_args: --mac dmg zip
          - os: windows-latest
            label: Windows
            builder_args: --win nsis portable

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build app bundle
        run: npm run build

      - name: Package installer
        run: npx electron-builder ${{ matrix.builder_args }} --publish never -c.directories.output=release
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: List packaged files
        shell: bash
        run: |
          echo "=== release tree ==="
          mkdir -p release
          find release -type f -print | sort
          echo "=== any installers in workspace ==="
          find . -type f \( -name '*.dmg' -o -name '*.exe' -o -name '*.zip' -o -name '*.blockmap' -o -name 'latest*.yml' \) -not -path './node_modules/*' | sort

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: contact-sync-${{ matrix.label }}
          path: |
            release/**
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve release tag
        id: tag
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "name=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "name=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Download macOS artifacts
        uses: actions/download-artifact@v4
        with:
          name: contact-sync-macOS
          path: release

      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: contact-sync-Windows
          path: release

      - name: List release files
        run: find release -type f | sort

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          name: Contact Sync ${{ steps.tag.outputs.name }}
          draft: false
          generate_release_notes: true
          files: release/**
          body: |
            ## Contact Sync ${{ steps.tag.outputs.name }}

            Desktop installers for **macOS** and **Windows**.

            | Platform | File |
            |----------|------|
            | macOS | `ContactSync-*.dmg` — open and drag into Applications |
            | Windows | `ContactSync-Setup-*.exe` — installer |
            | Windows | `ContactSync-Portable-*.exe` — no install needed |

            ### First open on macOS
            Builds are unsigned. If Gatekeeper blocks the app: right-click → **Open**.

            ### WhatsApp note
            This app uses an unofficial WhatsApp Web link (QR). Use at your own risk.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
